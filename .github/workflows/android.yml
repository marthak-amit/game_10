name: Build Android APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk chain-nova-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chain-nova-debug-apk
          path: chain-nova-debug.apk
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Chain Nova APK (build ${{ github.run_number }})
          body: Debug APK with AdMob TEST ads. Download chain-nova-debug.apk and install on Android.
          files: chain-nova-debug.apk
